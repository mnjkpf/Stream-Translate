<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --tr-accent-grad: linear-gradient(135deg, #6366f1, #8b5cf6);
      --tr-accent: #818cf8;
      --tr-accent-ring: rgba(129, 140, 248, .40);
      --tr-success: #34d399;
      --tr-danger: #fb7185;
      --tr-text: #f4f4f5;
      --tr-text-2: #b7b8c4;
      --tr-text-3: #83848f;
      --tr-border: rgba(255, 255, 255, .10);
      --tr-r-md: 12px;
      --tr-r-lg: 16px;
      --tr-pill: 999px;
      --tr-sh-2: 0 18px 44px rgba(0, 0, 0, .52);
      --tr-dur: 150ms;
      --tr-ease: cubic-bezier(.2, .7, .2, 1);
    }
    * { box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 20px;
      margin: 0;
      background: linear-gradient(160deg, #17181f, #0e0f15);
      color: var(--tr-text);
      border-radius: var(--tr-r-lg);
      box-shadow: var(--tr-sh-2);
    }
    .pp-head {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 18px;
    }
    .pp-logo {
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--tr-accent-grad);
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(99, 102, 241, .4);
      color: #fff;
    }
    .pp-title { font-size: 15px; font-weight: 600; line-height: 1.1; }
    .pp-sub { font-size: 11px; color: var(--tr-text-3); margin-top: 2px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--tr-text-3);
      margin: 15px 0 6px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      box-sizing: border-box;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--tr-border);
      color: var(--tr-text);
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color var(--tr-dur), box-shadow var(--tr-dur);
    }
    input:focus, select:focus {
      border-color: var(--tr-accent);
      box-shadow: 0 0 0 3px var(--tr-accent-ring);
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 11px;
      background: var(--tr-accent-grad);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      box-shadow: 0 6px 18px rgba(99, 102, 241, .4);
      transition: transform var(--tr-dur) var(--tr-ease), filter var(--tr-dur);
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.07); }
    .hint {
      font-size: 11px;
      color: var(--tr-text-3);
      margin-top: 5px;
    }
    .hint a { color: var(--tr-accent); }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
    }
    .ok { color: var(--tr-success); }
    .err { color: var(--tr-danger); }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="pp-head">
    <div class="pp-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
    </div>
    <div>
      <div class="pp-title">Subtitle Translator</div>
      <div class="pp-sub">AI-переклад субтитрів</div>
    </div>
  </div>

  <label for="apiKey">Gemini API Key</label>
  <input type="password" id="apiKey" placeholder="AIza...">
  <div class="hint">
    Отримати безкоштовно: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">aistudio.google.com</a>
  </div>

  <label for="sourceLang">Мова субтитрів</label>
  <select id="sourceLang">
    <option value="English">English</option>
    <option value="Russian">Російська</option>
    <option value="Spanish">Іспанська</option>
    <option value="French">Французька</option>
    <option value="German">Німецька</option>
  </select>

  <label for="targetLang">Перекладати на</label>
  <select id="targetLang">
    <option value="Ukrainian">Українська</option>
    <option value="Russian">Російська</option>
    <option value="English">Англійська</option>
  </select>

  <label for="model">Gemini модель</label>
  <input type="text" id="model" placeholder="gemini-2.0-flash">
  <div class="hint">
    Список моделей: <a href="https://ai.google.dev/gemini-api/docs/models" target="_blank" rel="noopener noreferrer">ai.google.dev</a>
  </div>

  <button id="save">Зберегти</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
