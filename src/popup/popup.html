<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --tr-accent-grad: linear-gradient(135deg, #6366f1, #8b5cf6);
      --tr-accent: #818cf8;
      --tr-accent-ring: rgba(129, 140, 248, .40);
      --tr-success: #34d399;
      --tr-danger: #fb7185;
      --tr-text: #f4f4f5;
      --tr-text-2: #b7b8c4;
      --tr-text-3: #83848f;
      --tr-border: rgba(255, 255, 255, .10);
      --tr-r-md: 12px;
      --tr-r-lg: 16px;
      --tr-sh-2: 0 18px 44px rgba(0, 0, 0, .52);
      --tr-dur: 150ms;
      --tr-ease: cubic-bezier(.2, .7, .2, 1);
    }
    * { box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 18px;
      margin: 0;
      background: linear-gradient(160deg, #17181f, #0e0f15);
      color: var(--tr-text);
      border-radius: var(--tr-r-lg);
      box-shadow: var(--tr-sh-2);
    }
    .pp-head {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 16px;
    }
    .pp-logo {
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--tr-accent-grad);
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(99, 102, 241, .4);
      color: #fff;
    }
    .pp-title { font-size: 15px; font-weight: 600; line-height: 1.1; }
    .pp-sub { font-size: 11px; color: var(--tr-text-3); margin-top: 2px; }

    /* Вкладки */
    .pp-tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--tr-border);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .pp-tab {
      flex: 1;
      padding: 8px 6px;
      background: transparent;
      border: none;
      color: var(--tr-text-3);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background var(--tr-dur), color var(--tr-dur);
    }
    .pp-tab:hover { color: var(--tr-text-2); }
    .pp-tab.active {
      background: var(--tr-accent-grad);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, .35);
    }

    .pp-panel[hidden] { display: none; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--tr-text-3);
      margin: 14px 0 6px;
    }
    label:first-child { margin-top: 0; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      box-sizing: border-box;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--tr-border);
      color: var(--tr-text);
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color var(--tr-dur), box-shadow var(--tr-dur);
    }
    input:focus, select:focus {
      border-color: var(--tr-accent);
      box-shadow: 0 0 0 3px var(--tr-accent-ring);
    }
    .pp-btn-primary {
      width: 100%;
      margin-top: 18px;
      padding: 11px;
      background: var(--tr-accent-grad);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      box-shadow: 0 6px 18px rgba(99, 102, 241, .4);
      transition: transform var(--tr-dur) var(--tr-ease), filter var(--tr-dur);
    }
    .pp-btn-primary:hover { transform: translateY(-1px); filter: brightness(1.07); }
    .pp-btn-primary:disabled { opacity: .6; cursor: default; transform: none; filter: none; }
    .pp-btn-ghost {
      width: 100%;
      margin-top: 16px;
      padding: 9px;
      background: rgba(255, 255, 255, .05);
      color: var(--tr-text-2);
      border: 1px solid var(--tr-border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      transition: background var(--tr-dur);
    }
    .pp-btn-ghost:hover { background: rgba(255, 255, 255, .10); }

    .hint { font-size: 11px; color: var(--tr-text-3); margin-top: 5px; }
    .hint a { color: var(--tr-accent); }
    .hint.warn { color: var(--tr-danger); }

    /* Перемикач джерела ключа */
    .pp-seg {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--tr-border);
      border-radius: 10px;
    }
    .pp-seg-btn {
      flex: 1;
      padding: 7px 6px;
      background: transparent;
      border: none;
      color: var(--tr-text-3);
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background var(--tr-dur), color var(--tr-dur);
    }
    .pp-seg-btn:hover { color: var(--tr-text-2); }
    .pp-seg-btn.active { background: var(--tr-accent-grad); color: #fff; }

    /* Кастомний дропдаун (shared/dropdown.ts) — нативний <select> малює список
       засобами ОС, його неможливо стилізувати під темну тему. */
    .subtr-dd { position: relative; }
    .subtr-dd-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--tr-border);
      color: var(--tr-text);
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color var(--tr-dur), box-shadow var(--tr-dur);
    }
    .subtr-dd-trigger:hover { border-color: rgba(255, 255, 255, .22); }
    .subtr-dd-trigger:focus-visible,
    .subtr-dd.is-open .subtr-dd-trigger {
      outline: none;
      border-color: var(--tr-accent);
      box-shadow: 0 0 0 3px var(--tr-accent-ring);
    }
    .subtr-dd-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .subtr-dd-chevron {
      flex: none;
      display: grid;
      place-items: center;
      color: var(--tr-text-3);
      transition: transform var(--tr-dur) var(--tr-ease);
    }
    .subtr-dd.is-open .subtr-dd-chevron { transform: rotate(180deg); }

    .subtr-dd-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 20;
      padding: 5px;
      background: #1b1c24;
      border: 1px solid var(--tr-border);
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, .55);
      max-height: 240px;
      overflow-y: auto;
    }
    .subtr-dd.is-open .subtr-dd-menu { display: block; }

    .subtr-dd-opt {
      width: 100%;
      display: block;
      padding: 8px 10px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--tr-text-2);
      font-family: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background var(--tr-dur), color var(--tr-dur);
    }
    .subtr-dd-opt:hover,
    .subtr-dd-opt:focus-visible { outline: none; background: rgba(255, 255, 255, .07); color: var(--tr-text); }
    .subtr-dd-opt.is-selected {
      background: linear-gradient(135deg, rgba(99, 102, 241, .22), rgba(139, 92, 246, .22));
      color: var(--tr-text);
    }
    .subtr-dd-opt-label { display: block; font-weight: 500; }
    .subtr-dd-opt-hint { display: block; font-size: 11px; color: var(--tr-text-3); margin-top: 2px; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
    }
    .ok { color: var(--tr-success); }
    .err { color: var(--tr-danger); }

    /* Профіль */
    .pp-empty {
      text-align: center;
      color: var(--tr-text-2);
      font-size: 13px;
      padding: 14px 4px;
      line-height: 1.5;
    }
    .pp-profile { display: flex; align-items: center; gap: 12px; }
    .pp-avatar {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--tr-accent-grad);
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
    }
    .pp-profile-name { font-size: 14px; font-weight: 600; }
    .pp-profile-email { font-size: 12px; color: var(--tr-text-3); margin-top: 2px; word-break: break-all; }
    .pp-profile-since { font-size: 11px; color: var(--tr-text-3); margin-top: 14px; }
    .pp-quota {
      margin-top: 14px;
      padding: 9px 11px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--tr-border);
      border-radius: 10px;
      font-size: 12px;
      color: var(--tr-text-2);
    }

    /* Статистика профілю — рахується клієнтськи зі списку слів */
    .pp-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .pp-stat {
      padding: 11px 6px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--tr-border);
      border-radius: 10px;
      text-align: center;
    }
    .pp-stat-value {
      font-size: 19px;
      font-weight: 700;
      background: var(--tr-accent-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }
    .pp-stat-label {
      font-size: 10px;
      color: var(--tr-text-3);
      margin-top: 3px;
      letter-spacing: .3px;
    }

    /* Слова */
    .pp-words-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .pp-search { flex: 1; margin: 0; }
    .pp-words-count { flex: none; font-size: 11px; color: var(--tr-text-3); white-space: nowrap; }
    .pp-word-head { display: flex; align-items: baseline; gap: 6px; }
    .pp-word-pos {
      font-size: 10px;
      color: var(--tr-text-3);
      padding: 1px 6px;
      border: 1px solid var(--tr-border);
      border-radius: 999px;
    }
    .pp-words { max-height: 300px; overflow-y: auto; }
    .pp-word {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 9px 0;
      border-bottom: 1px solid var(--tr-border);
    }
    .pp-word-main { flex: 1; min-width: 0; }
    .pp-word-lemma { font-size: 13px; font-weight: 600; }
    .pp-word-ctx {
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .pp-word-tr { font-size: 12px; color: var(--tr-text-2); margin-top: 2px; }
    .pp-word-ctx { font-size: 11px; color: var(--tr-text-3); margin-top: 3px; font-style: italic; }
    .pp-word-del {
      flex: none;
      width: 26px;
      height: 26px;
      padding: 0;
      background: transparent;
      border: 1px solid var(--tr-border);
      color: var(--tr-text-3);
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: color var(--tr-dur), border-color var(--tr-dur);
    }
    .pp-word-del:hover { color: var(--tr-danger); border-color: var(--tr-danger); }
    .pp-empty-sm { text-align: center; color: var(--tr-text-3); font-size: 12px; padding: 20px 0; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="pp-head">
    <div class="pp-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
    </div>
    <div>
      <div class="pp-title">Subtitle Translator</div>
      <div class="pp-sub">AI-переклад субтитрів</div>
    </div>
  </div>

  <div class="pp-tabs">
    <button type="button" class="pp-tab active" data-tab="profile">Профіль</button>
    <button type="button" class="pp-tab" data-tab="words">Слова</button>
    <button type="button" class="pp-tab" data-tab="settings">Налаштування</button>
  </div>

  <!-- Профіль -->
  <section class="pp-panel" data-panel="profile">
    <div id="profileLoggedOut" class="pp-empty">
      <p>Увійдіть, щоб синхронізувати слова й налаштування між пристроями.</p>
      <button type="button" id="profileLoginBtn" class="pp-btn-primary">Увійти через Google</button>
    </div>
    <div id="profileLoggedIn" hidden>
      <div class="pp-profile">
        <div class="pp-avatar" id="profileAvatar"></div>
        <div style="min-width:0">
          <div class="pp-profile-name" id="profileName"></div>
          <div class="pp-profile-email" id="profileEmail"></div>
        </div>
      </div>
      <div class="pp-stats">
        <div class="pp-stat">
          <div class="pp-stat-value" id="statTotal">0</div>
          <div class="pp-stat-label">Слів</div>
        </div>
        <div class="pp-stat">
          <div class="pp-stat-value" id="statWeek">0</div>
          <div class="pp-stat-label">За тиждень</div>
        </div>
        <div class="pp-stat">
          <div class="pp-stat-value" id="statPairs">0</div>
          <div class="pp-stat-label">Мовних пар</div>
        </div>
      </div>
      <div class="pp-quota" id="quotaRow" hidden></div>
      <div class="pp-profile-since" id="profileSince"></div>
      <button type="button" id="openDashboard" class="pp-btn-primary">Статистика та історія</button>
      <button type="button" id="logoutBtn" class="pp-btn-ghost">Вийти</button>
    </div>
  </section>

  <!-- Слова -->
  <section class="pp-panel" data-panel="words" hidden>
    <div id="wordsLoggedOut" class="pp-empty">Увійдіть, щоб бачити збережені слова.</div>
    <div id="wordsLoggedIn" hidden>
      <div class="pp-words-head">
        <input type="text" id="wordSearch" class="pp-search" placeholder="Пошук слова…">
        <span class="pp-words-count" id="wordsCount"></span>
      </div>
      <div id="wordsList" class="pp-words"></div>
    </div>
  </section>

  <!-- Налаштування -->
  <section class="pp-panel" data-panel="settings" hidden>
    <label>Ключ Gemini</label>
    <div class="pp-seg" id="keySource">
      <button type="button" class="pp-seg-btn active" data-key-source="own">Свій ключ</button>
      <button type="button" class="pp-seg-btn" data-key-source="proxy">Вбудований</button>
    </div>

    <div id="ownKeyBlock">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="AIza...">
      <div class="hint">
        Отримати безкоштовно: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">aistudio.google.com</a>
      </div>
    </div>

    <div id="proxyBlock" hidden>
      <div class="hint" id="proxyHint">Переклад іде через сервер — власний ключ не потрібен.</div>
    </div>

    <label>Мова субтитрів</label>
    <div id="sourceLangDd"></div>

    <label>Перекладати на</label>
    <div id="targetLangDd"></div>

    <label>Модель Gemini</label>
    <div id="modelDd"></div>

    <button type="button" id="save" class="pp-btn-primary">Зберегти</button>
    <div id="status"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
