# Профіль продакшену. Вмикається змінною середовища:
#   SPRING_PROFILES_ACTIVE=prod
#
# Тут НЕМАЄ жодного секрету і не повинно з'явитись — файл комітиться.
# Усе чутливе приходить змінними середовища хостингу. Spring Boot зіставляє
# їх із властивостями автоматично (relaxed binding: APP_JWT_SECRET -> app.jwt.secret),
# тому окремих рядків для них тут не треба:
#
#   SPRING_DATASOURCE_URL       jdbc:postgresql://host:5432/db
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   APP_JWT_SECRET              згенерувати НОВИЙ, не переносити локальний
#   APP_SETTINGS_SECRET         AES-256 (base64, РІВНО 32 байти) для шифрування
#                               ключів Gemini користувачів у базі
#   GEMINI_API_KEY              для проксі-перекладу; без нього проксі просто вимкнений

# За проксі Railway застосунок бачить лише адресу балансувальника. Ця властивість
# вмикає обробку X-Forwarded-* — без неї і схема в редиректах була б http, і
# обмеження частоти на /auth/** рахувалося б спільним для всіх користувачів.
server.forward-headers-strategy=framework

# PaaS-хостинги (Railway, Render, Fly.io) не дають вибрати порт: вони піднімають
# контейнер зі змінною PORT і стукають саме туди. Spring за замовчуванням слухає
# 8080, тож без цього рядка health-check не достукається, платформа вважатиме
# застосунок мертвим і перезапускатиме його по колу — з абсолютно здоровим логом.
# Значення за замовчуванням лишає 8080 для локального запуску й VPS.
server.port=${PORT:8080}

# Головний рядок цього файлу. Залежність spring-boot-docker-compose має scope
# runtime, тобто на сервері вона активна і Spring спробує підняти Postgres із
# compose.yaml — знайде dev-креденшели myuser/secret або впаде, не знайшовши
# docker. Це найчастіша причина падіння першого деплою.
spring.docker.compose.enabled=false

# У проді підключення йде до керованого Postgres, який вимагає TLS.
# Дубль до ?sslmode=require у самому URL — страховка на випадок, якщо рядок
# підключення скопіювали без параметра.
spring.datasource.hikari.data-source-properties.sslmode=require

# Безкоштовні тарифи керованого Postgres рахують саме одночасні з'єднання, а не
# запити. Типовий ліміт — кілька десятків на весь проєкт, тоді як HikariCP за
# замовчуванням тримає 10 відкритими постійно. Для навантаження «дії користувача,
# не потік» п'яти вистачає з запасом, і лишається місце для міграцій та ручних
# підключень psql. Піднімати варто лише коли в логах з'явиться очікування пулу.
spring.datasource.hikari.maximum-pool-size=5
# Тримати простій-з'єднання відкритими сенсу немає: база зі scale-to-zero
# однаково їх розриває, а Hikari потім витрачає час на перевірку мертвих.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000

# Жодного SQL у логах: запити містять тексти субтитрів і збережені слова,
# тобто те, що людина дивилась. Логи такого рівня деталізації — це витік.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# Помилки клієнту віддаються без стектрейсу й без повідомлення винятку —
# інакше внутрішня структура застосунку їде назовні при кожній 500-й.
server.error.include-stacktrace=never
server.error.include-message=never

# Swagger під цим профілем не піднімається взагалі (SwaggerDevSecurityConfig
# має @Profile("dev")), тож і генерувати специфікацію нема сенсу.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
