spring.application.name=backend

# Flyway керує схемою; Hibernate лише звіряє entity з реальними таблицями.
spring.jpa.hibernate.ddl-auto=validate
# Вимикає Open Session In View (анти-патерн за замовчуванням: lazy-loading у view-шарі -> N+1).
spring.jpa.open-in-view=false
# Всі TIMESTAMPTZ читаємо/пишемо в UTC незалежно від таймзони сервера.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Client ID OAuth-клієнта з Google Cloud Console (тип Web application).
# GoogleTokenVerifier звіряє з ним claim "aud" у Google ID-токені. TODO: замінити на реальне значення.
app.google.client-id=REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID

# Base64-секрет для HMAC-підпису НАШИХ JWT (JwtService). Це не Google-ключ і не пов'язаний з JWKS.
# Значення нижче — робочий плейсхолдер лише для локальної розробки; для прод-середовища згенерувати
# новий (напр. `openssl rand -base64 32`) і передавати через env/секрет-менеджер, а не application.properties.
app.jwt.secret=zFA6fmIYvJ6ZauyA9vSxXkd0zTKiDkWPRT2g0BMdMOQ=

