spring.application.name=backend

# Flyway керує схемою; Hibernate лише звіряє entity з реальними таблицями.
spring.jpa.hibernate.ddl-auto=validate
# Вимикає Open Session In View (анти-патерн за замовчуванням: lazy-loading у view-шарі -> N+1).
spring.jpa.open-in-view=false
# Всі TIMESTAMPTZ читаємо/пишемо в UTC незалежно від таймзони сервера.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Client ID OAuth-клієнта з Google Cloud Console (тип Web application).
# GoogleTokenVerifier звіряє з ним claim "aud" у Google ID-токені.
# Це НЕ секрет (client id завжди видно в redirect-запиті), тому лишається тут у git.
app.google.client-id=920419028505-459nmrlmq5fqb6hmvhl5odclptgcct8f.apps.googleusercontent.com

# HMAC-секрет для підпису НАШИХ JWT (JwtService) — це вже СПРАВЖНІЙ секрет: хто його
# знає, може підписати валідний токен від імені будь-якого користувача. Тому він НЕ тут,
# а в backend/src/main/resources/application-local.properties (гітігнорений, лише локально).
# Створи цей файл за зразком application-local.properties.example, якщо його ще нема.
spring.config.import=optional:classpath:application-local.properties
