spring.application.name=backend

# Профіль за замовчуванням — dev. Він відкриває Swagger (SwaggerDevSecurityConfig)
# і лишає активною docker-compose підтримку для локального Postgres. У продакшені
# профіль задається змінною середовища SPRING_PROFILES_ACTIVE=prod, і обидві ці
# зручності вимикаються самі — див. application-prod.properties.
spring.profiles.default=dev

# Актуатор віддає ЛИШЕ health: хостингу він потрібен для перевірки живості, а
# решта ендпоінтів (env, beans, mappings, configprops) розкривала б конфігурацію,
# зокрема імена властивостей із секретами. Spring і так за замовчуванням віддає
# тільки health — рядок явний, щоб випадкове розширення набору було свідомим.
management.endpoints.web.exposure.include=health
# Без деталей: повний health показує стан БД і диска стороннім, бо шлях відкритий.
management.endpoint.health.show-details=never

# Flyway керує схемою; Hibernate лише звіряє entity з реальними таблицями.
spring.jpa.hibernate.ddl-auto=validate
# Вимикає Open Session In View (анти-патерн за замовчуванням: lazy-loading у view-шарі -> N+1).
spring.jpa.open-in-view=false
# Всі TIMESTAMPTZ читаємо/пишемо в UTC незалежно від таймзони сервера.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Client ID OAuth-клієнта з Google Cloud Console (тип Web application).
# GoogleTokenVerifier звіряє з ним claim "aud" у Google ID-токені.
# Це НЕ секрет (client id завжди видно в redirect-запиті), тому лишається тут у git.
app.google.client-id=920419028505-459nmrlmq5fqb6hmvhl5odclptgcct8f.apps.googleusercontent.com

# HMAC-секрет для підпису НАШИХ JWT (JwtService) — це вже СПРАВЖНІЙ секрет: хто його
# знає, може підписати валідний токен від імені будь-якого користувача. Тому він НЕ тут,
# а в backend/src/main/resources/application-local.properties (гітігнорений, лише локально).
# Створи цей файл за зразком application-local.properties.example, якщо його ще нема.
spring.config.import=optional:classpath:application-local.properties

# ── Проксі-переклад (вбудований ключ) ────────────────────────────────────────
# Ключ береться ЛИШЕ зі змінної середовища GEMINI_API_KEY і ніколи не лежить у git.
# PowerShell:  $env:GEMINI_API_KEY = "AIza..."   (перед .\mvnw spring-boot:run)
# Порожнє значення = проксі вимкнений (ендпоінт відповідає 503, а не падає).
app.gemini.api-key=${GEMINI_API_KEY:}

# Вимикач на випадок вигорання квоти — не треба передеплоювати, досить рестарту.
app.proxy.enabled=true
app.proxy.model=gemini-3.5-flash-lite

# Ліміти НЕ зашиті в код: Google більше не публікує точні квоти free tier у
# документації (їх видно лише в AI Studio → Rate limits під твоїм акаунтом),
# і вони змінюються. Підбери під свої реальні цифри.
# daily-global — стеля на весь сервіс: ліміти Gemini діють на ПРОЄКТ, тож без неї
# один активний користувач вичерпав би квоту для всіх. Раджу ~60-70% від RPD.
app.proxy.daily-per-user=50
app.proxy.daily-global=1000

# ── Історія перекладів ──────────────────────────────────────────────────────
# Історія показує, що людина дивилась і коли, тому не зберігається вічно:
# HistoryRetentionJob щоночі видаляє записи, старші за цей строк.
app.history.retention-days=90
